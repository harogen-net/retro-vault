<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Retro Vault logo icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#2b1241" />
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#31f7ff" />
      <stop offset="100%" stop-color="#7d4dff" />
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0a8" />
      <stop offset="100%" stop-color="#ffbb4f" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <rect x="52" y="52" width="408" height="408" rx="72" fill="none" stroke="url(#frame)" stroke-width="22" filter="url(#glow)" />

  <rect x="96" y="118" width="320" height="276" rx="40" fill="#171327" stroke="#3ad9ff" stroke-width="10" />

  <text x="256" y="278" text-anchor="middle" fill="url(#text)" stroke="#2b1a06" stroke-width="8" paint-order="stroke" font-size="148" font-weight="900" font-family="Arial Black, Impact, sans-serif" letter-spacing="4">RV</text>
  <rect x="124" y="316" width="264" height="56" rx="12" fill="#0f2231" stroke="#56f7ff" stroke-width="4" opacity="0.95" />
  <text x="256" y="355" text-anchor="middle" fill="#d7fbff" font-size="30" font-weight="800" font-family="Trebuchet MS, Verdana, Geneva, sans-serif" letter-spacing="3">RETRO VAULT</text>

  <rect x="114" y="142" width="284" height="8" fill="#56f7ff" opacity="0.45" />
  <rect x="114" y="382" width="284" height="8" fill="#56f7ff" opacity="0.25" />
</svg>
